name: Update Profile README

on:
  push:
    branches: [main]
    paths:
      - readme.source.md
      - .github/workflows/profile-readme.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate contribution space shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: NexVed
          output-path: assets/github-space-shooter.gif
          strategy: row
          fps: 24
          no-commit: true

      - name: Apply gold theme to contribution animation
        run: python scripts/recolor_space_shooter.py assets/github-space-shooter.gif

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=NexVed&show_icons=true&include_all_commits=true&hide=contribs&show=all_time_contribs&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&icon_color=f5c76b&border_color=d99b3d&hide_border=false"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=NexVed&layout=compact&langs_count=8&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&border_color=d99b3d&hide_border=false"
          path: assets/github-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Update README from source
        run: cp readme.source.md README.md

      - name: Commit generated README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg assets/github-languages.svg assets/github-space-shooter.gif
          git diff --cached --quiet && exit 0
          git commit -m "Update profile README"
          git push
