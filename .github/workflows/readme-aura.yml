name: Update Profile README

on:
  push:
    branches: [main]
    paths:
      - readme.source.md
      - .github/workflows/readme.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate contribution space shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: NexVed
          output-path: assets/github-space-shooter.gif
          strategy: row
          fps: 24
          no-amend: true

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=NexVed&show_icons=true&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&icon_color=f5c76b&border_color=d99b3d&hide_border=false"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=NexVed&layout=compact&langs_count=8&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&border_color=d99b3d&hide_border=false"
          path: assets/github-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Render readme-aura components and README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated README assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets assets/github-stats.svg assets/github-languages.svg assets/github-space-shooter.gif
          git commit -m "Update profile README" || exit 0
          git push
