<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Animated GitHub streak heatmap game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#18130b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <rect id="cell" width="20" height="20" rx="4"/>
    <style>
      @keyframes clearBlock { 0%,4% { opacity:1; transform:scale(1); } 6%,12% { opacity:.08; transform:scale(.35); } 15%,100% { opacity:1; transform:scale(1); } }
      .cell { transform-box:fill-box; transform-origin:center; animation:clearBlock 14s linear infinite; }
      .g1 { fill:#5a3a12; }.g2 { fill:#9b6723; }.g3 { fill:#d99b3d; }.g4 { fill:#f5c76b; }.ship { filter:url(#glow); }
    </style>
  </defs>
  <rect width="900" height="220" rx="14" fill="url(#bg)" stroke="#d99b3d"/>
  <text x="34" y="34" fill="#f5c76b" font-family="Arial,sans-serif" font-size="20" font-weight="700">GitHub Streak Heatmap // Mission Mode</text>
  <text x="34" y="52" fill="#c9a85a" font-family="Arial,sans-serif" font-size="12">The ship clears contribution blocks one by one.</text>
  <g transform="translate(210 70)">
    <use xlink:href="#cell" class="cell g2" x="0" y="0" style="animation-delay:0s"/><use xlink:href="#cell" class="cell g1" x="36" y="0" style="animation-delay:-.2s"/><use xlink:href="#cell" class="cell g3" x="72" y="0" style="animation-delay:-.4s"/><use xlink:href="#cell" class="g2 cell" x="108" y="0" style="animation-delay:-.6s"/><use xlink:href="#cell" class="g4 cell" x="144" y="0" style="animation-delay:-.8s"/><use xlink:href="#cell" class="g1 cell" x="180" y="0" style="animation-delay:-1s"/><use xlink:href="#cell" class="g3 cell" x="216" y="0" style="animation-delay:-1.2s"/><use xlink:href="#cell" class="g2 cell" x="252" y="0" style="animation-delay:-1.4s"/><use xlink:href="#cell" class="g4 cell" x="288" y="0" style="animation-delay:-1.6s"/><use xlink:href="#cell" class="g1 cell" x="324" y="0" style="animation-delay:-1.8s"/><use xlink:href="#cell" class="g3 cell" x="360" y="0" style="animation-delay:-2s"/><use xlink:href="#cell" class="g2 cell" x="396" y="0" style="animation-delay:-2.2s"/>
    <use xlink:href="#cell" class="g1 cell" x="0" y="28" style="animation-delay:-2.4s"/><use xlink:href="#cell" class="g3 cell" x="36" y="28" style="animation-delay:-2.6s"/><use xlink:href="#cell" class="g2 cell" x="72" y="28" style="animation-delay:-2.8s"/><use xlink:href="#cell" class="g4 cell" x="108" y="28" style="animation-delay:-3s"/><use xlink:href="#cell" class="g1 cell" x="144" y="28" style="animation-delay:-3.2s"/><use xlink:href="#cell" class="g3 cell" x="180" y="28" style="animation-delay:-3.4s"/><use xlink:href="#cell" class="g2 cell" x="216" y="28" style="animation-delay:-3.6s"/><use xlink:href="#cell" class="g4 cell" x="252" y="28" style="animation-delay:-3.8s"/><use xlink:href="#cell" class="g1 cell" x="288" y="28" style="animation-delay:-4s"/><use xlink:href="#cell" class="g3 cell" x="324" y="28" style="animation-delay:-4.2s"/><use xlink:href="#cell" class="g2 cell" x="360" y="28" style="animation-delay:-4.4s"/><use xlink:href="#cell" class="g4 cell" x="396" y="28" style="animation-delay:-4.6s"/>
    <use xlink:href="#cell" class="g3 cell" x="0" y="56" style="animation-delay:-4.8s"/><use xlink:href="#cell" class="g2 cell" x="36" y="56" style="animation-delay:-5s"/><use xlink:href="#cell" class="g4 cell" x="72" y="56" style="animation-delay:-5.2s"/><use xlink:href="#cell" class="g1 cell" x="108" y="56" style="animation-delay:-5.4s"/><use xlink:href="#cell" class="g3 cell" x="144" y="56" style="animation-delay:-5.6s"/><use xlink:href="#cell" class="g2 cell" x="180" y="56" style="animation-delay:-5.8s"/><use xlink:href="#cell" class="g4 cell" x="216" y="56" style="animation-delay:-6s"/><use xlink:href="#cell" class="g1 cell" x="252" y="56" style="animation-delay:-6.2s"/><use xlink:href="#cell" class="g3 cell" x="288" y="56" style="animation-delay:-6.4s"/><use xlink:href="#cell" class="g2 cell" x="324" y="56" style="animation-delay:-6.6s"/><use xlink:href="#cell" class="g4 cell" x="360" y="56" style="animation-delay:-6.8s"/><use xlink:href="#cell" class="g1 cell" x="396" y="56" style="animation-delay:-7s"/>
    <use xlink:href="#cell" class="g2 cell" x="0" y="84" style="animation-delay:-7.2s"/><use xlink:href="#cell" class="g4 cell" x="36" y="84" style="animation-delay:-7.4s"/><use xlink:href="#cell" class="g1 cell" x="72" y="84" style="animation-delay:-7.6s"/><use xlink:href="#cell" class="g3 cell" x="108" y="84" style="animation-delay:-7.8s"/><use xlink:href="#cell" class="g2 cell" x="144" y="84" style="animation-delay:-8s"/><use xlink:href="#cell" class="g4 cell" x="180" y="84" style="animation-delay:-8.2s"/><use xlink:href="#cell" class="g1 cell" x="216" y="84" style="animation-delay:-8.4s"/><use xlink:href="#cell" class="g3 cell" x="252" y="84" style="animation-delay:-8.6s"/><use xlink:href="#cell" class="g2 cell" x="288" y="84" style="animation-delay:-8.8s"/><use xlink:href="#cell" class="g4 cell" x="324" y="84" style="animation-delay:-9s"/><use xlink:href="#cell" class="g1 cell" x="360" y="84" style="animation-delay:-9.2s"/><use xlink:href="#cell" class="g3 cell" x="396" y="84" style="animation-delay:-9.4s"/>
  </g>
  <g class="ship" transform="translate(170 72)">
    <path d="M0 8 L20 0 L40 8 L20 16 Z" fill="#fff"/><path d="M13 8 L20 3 L27 8 L20 13 Z" fill="#f5c76b"/><circle cx="20" cy="8" r="2" fill="#d99b3d"/>
    <animateMotion dur="14s" repeatCount="indefinite" path="M0 0 L432 0 L432 28 L0 28 L0 56 L432 56 L432 84 L0 84"/>
  </g>
  <line x1="34" y1="184" x2="866" y2="184" stroke="#d99b3d" opacity=".7"/><circle cx="450" cy="184" r="3" fill="#f5c76b"/>
</svg>
