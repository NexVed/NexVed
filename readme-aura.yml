name: Generate README

on:
  push:
    branches: [main]
    paths:
      - readme.source.md
      - .github/workflows/readme-aura.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Generate GitHub space shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: NexVed
          output-path: assets/github-space-shooter.gif
          strategy: row
          fps: 24
          no-amend: true
      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=NexVed&show_icons=true&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&icon_color=f5c76b&border_color=d99b3d&hide_border=false"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=NexVed&layout=compact&langs_count=8&bg_color=30,050505,18130b&title_color=f5c76b&text_color=fff7e6&border_color=d99b3d&hide_border=false"
          path: assets/github-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets assets/github-stats.svg assets/github-languages.svg assets/github-space-shooter.gif
          git commit -m "Update GitHub profile cards" || exit 0
          git push
